<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Prompt Scorer</title>
  <style>
    :root {
      box-sizing: border-box;
      padding-top: env(safe-area-inset-top, 0px);
      padding-bottom: env(safe-area-inset-bottom, 0px);
      --bg: #f6f5ff;
      --surface: #fff;
      --text: #16132b;
      --muted: #5d5a78;
      --accent: #6d28d9;
      --accent2: #ec4899;
      --border: #e2e0f5;
      --ok: #15803d;
      --bad: #b91c1c
    }

    @media (prefers-color-scheme:dark) {
      :root:not([data-theme="light"]) {
        color-scheme: dark;
        --bg: #0c0a1d;
        --surface: #16132e;
        --text: #f1efff;
        --muted: #a19ec4;
        --accent: #a78bfa;
        --accent2: #f472b6;
        --border: #2a2650;
        --ok: #4ade80;
        --bad: #f87171
      }
    }

    :root[data-theme="dark"] {
      color-scheme: dark;
      --bg: #0c0a1d;
      --surface: #16132e;
      --text: #f1efff;
      --muted: #a19ec4;
      --accent: #a78bfa;
      --accent2: #f472b6;
      --border: #2a2650;
      --ok: #4ade80;
      --bad: #f87171
    }

    * {
      box-sizing: border-box
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      line-height: 1.5
    }

    main {
      max-width: 680px;
      margin: 0 auto;
      padding: 32px 18px
    }

    h1 {
      margin: 0 0 4px;
      font-size: clamp(1.8rem, 6vw, 2.6rem)
    }

    .grad {
      background: linear-gradient(90deg, var(--accent), var(--accent2));
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent
    }

    .sub {
      color: var(--muted);
      margin: 0 0 20px
    }

    textarea {
      width: 100%;
      min-height: 130px;
      padding: 14px;
      border-radius: 14px;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text);
      font: inherit;
      resize: vertical
    }

    textarea:focus {
      outline: 2px solid var(--accent)
    }

    .bar {
      height: 12px;
      background: var(--border);
      border-radius: 99px;
      overflow: hidden;
      margin: 18px 0 6px
    }

    .bar i {
      display: block;
      height: 100%;
      width: 0;
      background: linear-gradient(90deg, var(--accent), var(--accent2));
      transition: width .4s
    }

    .score {
      display: flex;
      justify-content: space-between;
      font-weight: 700
    }

    ul {
      list-style: none;
      padding: 0;
      margin: 16px 0;
      display: grid;
      gap: 8px
    }

    li {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 10px 14px;
      display: flex;
      gap: 10px
    }

    li b {
      min-width: 20px
    }

    li.ok b {
      color: var(--ok)
    }

    li.no b {
      color: var(--bad)
    }

    li small {
      display: block;
      color: var(--muted)
    }

    button {
      border: 0;
      cursor: pointer;
      font: inherit;
      font-weight: 600;
      padding: 11px 20px;
      border-radius: 12px;
      color: #fff;
      background: linear-gradient(90deg, var(--accent), var(--accent2))
    }
  </style>
</head>

<body>
  <main>
    <h1>Prompt <span class="grad">Scorer</span></h1>
    <p class="sub">Write an AI prompt and see how strong it is. Prompt smarter.</p>
    <textarea id="p"
      placeholder="Try: You are a career coach. Write a 3-step plan for a fresher to get a data job. Keep it under 150 words as a bulleted list."></textarea>
    <div class="bar"><i id="fill"></i></div>
    <div class="score"><span id="label">Start typing…</span><span id="num">0/100</span></div>
    <ul id="list"></ul>
    <button id="fix">Copy improved template</button>
  </main>
  <script>
    const checks = [
      { name: "Role", tip: "Tell the AI who to be, e.g. “You are a career coach”.", test: t => /\b(you are|act as|as a|role)\b/i.test(t) },
      { name: "Clear task", tip: "Start with an action verb: write, explain, build, list…", test: t => /\b(write|explain|build|create|list|summari[sz]e|generate|design|compare|analy[sz]e)\b/i.test(t) },
      { name: "Context", tip: "Add who it’s for or the situation (at least 15 words).", test: t => t.trim().split(/\s+/).length >= 15 },
      { name: "Output format", tip: "Ask for a format: bullets, table, JSON, steps…", test: t => /\b(bullet|table|json|steps?|list|paragraph|markdown|format)\b/i.test(t) },
      { name: "Constraints", tip: "Add limits: word count, tone, language, length.", test: t => /\b(under|within|max|at most|only|tone|words?|no more than|avoid)\b/i.test(t) }
    ];
    const p = document.getElementById("p"), list = document.getElementById("list");
    function run() {
      const t = p.value; let n = 0;
      list.innerHTML = "";
      checks.forEach(c => {
        const ok = t && c.test(t); if (ok) n++;
        const li = document.createElement("li"); li.className = ok ? "ok" : "no";
        li.innerHTML = `<b>${ok ? "✓" : "✗"}</b><div>${c.name}${ok ? "" : `<small>${c.tip}</small>`}</div>`;
        list.appendChild(li);
      });
      const s = n * 20;
      document.getElementById("fill").style.width = s + "%";
      document.getElementById("num").textContent = s + "/100";
      document.getElementById("label").textContent = !t ? "Start typing…" : s >= 80 ? "Great prompt 🚀" : s >= 40 ? "Getting there" : "Needs work";
    }
    document.getElementById("fix").onclick = async e => {
      const task = p.value.trim() || "[your task]";
      const out = `Role: You are an expert in [field].\nTask: ${task}\nContext: [who it's for, background]\nFormat: [bullets / table / steps]\nConstraints: [length, tone, language]`;
      try { await navigator.clipboard.writeText(out); e.target.textContent = "Copied ✓" } catch (_) { e.target.textContent = "Copy blocked" }
      setTimeout(() => e.target.textContent = "Copy improved template", 1500);
    };
    p.addEventListener("input", run); run();
  </script>
</body>

</html>
